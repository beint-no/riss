name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      automatic_release:
        description: "Automatically release the Central Portal deployment"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check release version
        run: |
          version="$(sed -n 's/^[[:space:]]*version = "\(.*\)"/\1/p' build.gradle.kts | head -n 1)"
          test -n "$version"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF#refs/tags/v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "Tag version $tag_version does not match Gradle version $version" >&2
              exit 1
            fi
          fi

          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "Release publishing requires a non-SNAPSHOT version, found $version" >&2
            exit 1
          fi

          echo "Publishing version $version"

      - name: Build
        run: ./gradlew build

      - name: Publish
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.automatic_release }}" == "true" ]]; then
            ./gradlew publishAndReleaseToMavenCentral
          else
            ./gradlew publishToMavenCentral
          fi

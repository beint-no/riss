version: 2
updates:
- package-ecosystem: gradle
  directory: /
  schedule:
    interval: weekly
    time: 04:00
  groups:
    gradle:
      patterns:
      - '*'
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    time: 04:00
  groups:
    github-actions-updates:
      patterns:
      - '*'
